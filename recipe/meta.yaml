{% set name = "flowjax" %}
{% set version = "19.2.1" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/flowjax-{{ version }}.tar.gz
  sha256: d535b8f6533780faee3cc205bc45aa3718cf26abab8a41c812bb5f54c67ddf2a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ={{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - jax >=0.7.0
    - equinox >=0.11
    - jaxtyping
    - tqdm
    - optax
    - paramax >=0.0.5
    - lineax

test:
  imports:
    - flowjax
  commands:
    - pip check
  requires:
    - pip
    - python ={{ python_min }}

about:
  summary: Easy to use distributions, bijections and normalizing flows in JAX.
  home: https://github.com/danielward27/flowjax
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - beckermr
